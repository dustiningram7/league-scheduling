settings:
  diagnostic_mode: false
  use_soft_constraints: true
  log_objective_contributions: true

constraints:
  # hard constraints
  schedule_once: # Each match must be assigned to exactly one court-time slot.
    enabled: true
  court_capacity: # Total courts used at any facility-time slot cannot exceed the number available.
    enabled: true
  adjacent_flights: # Prevents two adjacent flight levels within the same gender and league from playing on the same day.
    enabled: true
  team_spacing_hard: # No team may play two matches closer than a minimum number of days apart. Enforced across all team match combinations.
    enabled: true
    min_hard_spacing: 4
  # soft constraints
  team_spacing_target: # Rewards teams whose minimum spacing between consecutive matches meets or exceeds a preferred target.
    enabled: true
    weight: 3
    target: 6
  date_fairness: # Encourages even distribution of matches across available dates. Penalties apply if dates are over- or under-used.
    enabled: true
    weight: 1
  segment_fairness: # Encourages balanced match distribution across Morning, Afternoon, and Evening segments.
    enabled: true
    weight: 1
  grouping: # Incentivizes matches from the same league/flight level to be scheduled together in the same time segment.
    enabled: true
    weight: 2
  discourage_9pm: # Adds a penalty for matches scheduled at 9PM or later.
    enabled: true
    weight: 5
  round_grouping: # Encourages all matches from a given round to be played on the same date.
    enabled: true
    weight: 1
  match_order: # Discourages scheduling higher Match #s before lower ones within the same league and flight level.
    enabled: false
    weight: 3

solver:
  max_time_seconds: 14400
  num_search_workers: 4
  log_search_progress: true
  random_seed: 42
  log_every_n: 5   # 👈 Only log every 5th solution

